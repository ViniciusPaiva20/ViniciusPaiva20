name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#38BDF8&color_empty=#0F1C45&color_dots=#12326F,#1D4ED8,#3B82F6,#60A5FA,#BAE6FD
            dist/github-snake.svg?color_snake=#0B1B4D&color_empty=#E2E8F0&color_dots=#BFDBFE,#93C5FD,#3B82F6,#1D4ED8,#0B1B4D
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
